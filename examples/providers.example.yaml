# Before installation: merge this provider into your own providers.yaml.
# Keep unrelated providers. Replace the placeholder locally; never commit a key.
# manage.py install changes only this provider's URL and tools capability.
providers:
  - id: deepseek
    name: DeepSeek
    base_url: https://api.deepseek.com
    api_keys:
      deepseek: YOUR_DEEPSEEK_API_KEY
    additional_parameters:
      thinking:
        type: enabled
      tool_choice: auto
      tools:
        - type: deepseek_web_search
        - type: deepseek_read_url
    models:
      - id: deepseek-flash
        name: DeepSeek Flash (Adapter)
        provider: deepseek
        description: DeepSeek Flash with native web tools and local file access via the adapter
        context: 1000000
        abilities:
          temperature:
            supported: true
          vision:
            supported: true
          system_message:
            supported: true
          tools:
            supported: true
          reasoning_effort:
            supported: true
